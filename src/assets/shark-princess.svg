<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Shark Princess</title>
  <desc id="desc">A cheerful whale shark princess with a jeweled crown and pearl necklace, drawn as compact vector artwork for Puffer Panic.</desc>

  <defs>
    <linearGradient id="sp-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#77a9c1"/>
      <stop offset="0.48" stop-color="#4e839e"/>
      <stop offset="1" stop-color="#315f78"/>
    </linearGradient>
    <linearGradient id="sp-belly" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset="1" stop-color="#d8e8e7"/>
    </linearGradient>
    <linearGradient id="sp-fin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f95ae"/>
      <stop offset="1" stop-color="#315f78"/>
    </linearGradient>
    <linearGradient id="sp-gold" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fff170"/>
      <stop offset="0.25" stop-color="#ffd65a"/>
      <stop offset="0.7" stop-color="#e7a52c"/>
      <stop offset="1" stop-color="#b86c16"/>
    </linearGradient>
    <linearGradient id="sp-gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9bc4"/>
      <stop offset="0.45" stop-color="#ec4d8d"/>
      <stop offset="1" stop-color="#9f255b"/>
    </linearGradient>
  </defs>

  <!-- tail behind body -->
  <path d="M945 327 C1028 267 1093 197 1147 123
           C1159 108 1179 115 1174 135
           C1160 193 1137 252 1113 300
           C1140 293 1166 288 1184 291
           C1198 294 1200 312 1186 319
           C1162 332 1141 345 1117 365
           C1143 390 1164 415 1179 440
           C1188 456 1175 472 1159 463
           C1098 430 1028 403 948 389 Z"
        fill="url(#sp-fin)" stroke="#214c63" stroke-width="10" stroke-linejoin="round"/>

  <!-- far fin -->
  <path d="M634 501 C725 540 809 594 853 647
           C866 663 854 679 836 675
           C746 658 664 618 596 558 Z"
        fill="#3e7088" stroke="#214c63" stroke-width="9" stroke-linejoin="round"/>

  <!-- dorsal fin -->
  <path d="M657 248 C704 171 765 124 832 106
           C850 102 859 118 851 133
           C817 195 799 250 802 303 Z"
        fill="url(#sp-fin)" stroke="#214c63" stroke-width="10" stroke-linejoin="round"/>

  <!-- main body -->
  <path d="M111 373
           C127 258 247 196 410 196
           C602 196 742 241 846 310
           C897 344 934 366 986 371
           C947 415 904 447 842 477
           C728 533 578 566 405 550
           C241 535 134 476 111 373 Z"
        fill="url(#sp-body)" stroke="#214c63" stroke-width="12" stroke-linejoin="round"/>

  <!-- belly -->
  <path d="M118 390
           C154 463 262 508 414 518
           C573 528 713 503 823 455
           C736 548 563 587 382 561
           C226 539 139 476 118 390 Z"
        fill="url(#sp-belly)" opacity="0.97"/>

  <!-- nose highlight -->
  <path d="M127 336 C178 276 267 247 368 242
           C299 265 244 296 213 337
           C183 347 154 347 127 336 Z"
        fill="#9fc5d4" opacity="0.72"/>

  <!-- near pectoral fin -->
  <path d="M563 469
           C651 510 738 577 791 642
           C803 657 791 672 773 668
           C673 645 585 597 514 532 Z"
        fill="url(#sp-fin)" stroke="#214c63" stroke-width="10" stroke-linejoin="round"/>

  <!-- small rear fin -->
  <path d="M865 449 C901 472 932 504 948 533
           C954 545 946 554 934 550
           C895 536 861 513 832 484 Z"
        fill="#356b83" stroke="#214c63" stroke-width="8"/>

  <!-- whale-shark stripe accents -->
  <g fill="none" stroke="#b9d4dc" stroke-width="10" stroke-linecap="round" opacity="0.55">
    <path d="M515 229 C541 285 545 344 535 401"/>
    <path d="M603 240 C630 298 635 360 623 423"/>
    <path d="M691 261 C716 315 720 372 708 431"/>
    <path d="M773 292 C793 335 796 378 787 417"/>
  </g>

  <!-- whale shark spots: deliberately simple, scalable circles/ellipses -->
  <g fill="#e8eee7" opacity="0.92">
    <circle cx="245" cy="269" r="12"/><circle cx="286" cy="249" r="8"/>
    <circle cx="329" cy="267" r="11"/><circle cx="377" cy="242" r="8"/>
    <circle cx="427" cy="258" r="12"/><circle cx="473" cy="236" r="8"/>
    <circle cx="532" cy="263" r="11"/><circle cx="584" cy="248" r="8"/>
    <circle cx="639" cy="273" r="11"/><circle cx="700" cy="275" r="8"/>
    <circle cx="752" cy="306" r="10"/><circle cx="814" cy="326" r="8"/>
    <circle cx="861" cy="351" r="10"/>

    <circle cx="205" cy="312" r="8"/><circle cx="268" cy="304" r="10"/>
    <circle cx="345" cy="314" r="8"/><circle cx="410" cy="306" r="11"/>
    <circle cx="487" cy="319" r="8"/><circle cx="565" cy="315" r="10"/>
    <circle cx="652" cy="330" r="8"/><circle cx="732" cy="339" r="10"/>
    <circle cx="812" cy="365" r="8"/><circle cx="892" cy="384" r="10"/>

    <circle cx="321" cy="369" r="10"/><circle cx="390" cy="363" r="7"/>
    <circle cx="462" cy="376" r="10"/><circle cx="550" cy="372" r="7"/>
    <circle cx="629" cy="388" r="10"/><circle cx="708" cy="395" r="7"/>
    <circle cx="787" cy="412" r="10"/>

    <circle cx="393" cy="426" r="8"/><circle cx="475" cy="431" r="10"/>
    <circle cx="557" cy="438" r="7"/><circle cx="648" cy="449" r="10"/>
    <circle cx="735" cy="454" r="7"/>
  </g>

  <!-- fin/tail spots -->
  <g fill="#dbe8e8" opacity="0.8">
    <circle cx="724" cy="202" r="9"/><circle cx="759" cy="171" r="7"/><circle cx="791" cy="148" r="10"/>
    <circle cx="763" cy="220" r="8"/><circle cx="805" cy="202" r="7"/>
    <circle cx="1047" cy="317" r="10"/><circle cx="1082" cy="269" r="8"/>
    <circle cx="1110" cy="221" r="10"/><circle cx="1131" cy="168" r="7"/>
    <circle cx="1080" cy="379" r="9"/><circle cx="1124" cy="411" r="7"/>
    <circle cx="646" cy="543" r="9"/><circle cx="688" cy="567" r="7"/>
    <circle cx="730" cy="593" r="9"/>
  </g>

  <!-- cheerful eye -->
  <path d="M285 336 C310 303 356 299 381 329
           C360 315 329 315 307 336
           C298 343 290 342 285 336 Z"
        fill="#18384c"/>
  <ellipse cx="337" cy="347" rx="34" ry="42" fill="#fffdf4" stroke="#214c63" stroke-width="7"/>
  <ellipse cx="343" cy="355" rx="18" ry="25" fill="#244c7d"/>
  <ellipse cx="347" cy="359" rx="10" ry="16" fill="#102338"/>
  <circle cx="352" cy="347" r="6" fill="white"/>
  <path d="M364 312 l12 -13 M371 317 l16 -8 M376 324 l16 -1"
        fill="none" stroke="#18384c" stroke-width="7" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="395" cy="389" rx="25" ry="17" fill="#f39aaa" opacity="0.82"/>

  <!-- broad happy whale-shark mouth: no visible teeth -->
  <path d="M121 376
           C171 417 240 432 308 412
           C281 459 194 470 142 427
           C125 413 117 395 121 376 Z"
        fill="#7f3e53" stroke="#214c63" stroke-width="9" stroke-linejoin="round"/>
  <path d="M160 424 C196 412 239 416 271 436
           C235 459 191 459 160 440 Z"
        fill="#ef8b91"/>
  <path d="M120 375 C170 399 235 403 307 382"
        fill="none" stroke="#fff5df" stroke-width="14" stroke-linecap="round"/>

  <!-- nostrils -->
  <ellipse cx="152" cy="356" rx="7" ry="5" fill="#5d5661" opacity="0.75"/>
  <ellipse cx="189" cy="360" rx="6" ry="4.5" fill="#5d5661" opacity="0.75"/>

  <!-- gill slits -->
  <g fill="none" stroke="#214c63" stroke-width="7" stroke-linecap="round" opacity="0.82">
    <path d="M438 351 q-13 28 -2 56"/>
    <path d="M455 348 q-12 30 -1 59"/>
    <path d="M472 348 q-11 29 0 57"/>
  </g>

  <!-- pearl necklace -->
  <path d="M370 438 C421 494 494 521 566 513"
        fill="none" stroke="#c08ab0" stroke-width="7" opacity="0.7"/>
  <g fill="#fff7fa" stroke="#b98cae" stroke-width="5">
    <circle cx="382" cy="451" r="13"/><circle cx="404" cy="470" r="13"/>
    <circle cx="429" cy="486" r="13"/><circle cx="456" cy="499" r="13"/>
    <circle cx="485" cy="507" r="13"/><circle cx="515" cy="512" r="13"/>
    <circle cx="545" cy="511" r="13"/>
  </g>

  <!-- shell pendant -->
  <g transform="translate(471 514)">
    <circle cx="0" cy="-2" r="9" fill="#d99839" stroke="#9b6327" stroke-width="4"/>
    <path d="M0 5
             C-27 9 -31 39 0 55
             C31 39 27 9 0 5 Z"
          fill="#f29ab4" stroke="#b85b7f" stroke-width="6"/>
    <path d="M0 10 v38 M-13 14 q4 20 13 34 M13 14 q-4 20 -13 34"
          fill="none" stroke="#ffd0dd" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- crown -->
  <g transform="translate(290 166) rotate(-4)">
    <path d="M-58 55 L-50 -15 L-17 26 L7 -39 L34 25 L67 -13 L60 57 Z"
          fill="url(#sp-gold)" stroke="#a76617" stroke-width="9" stroke-linejoin="round"/>
    <path d="M-58 55 Q0 70 60 57 L56 83 Q0 96 -54 82 Z"
          fill="#e8a52b" stroke="#a76617" stroke-width="9" stroke-linejoin="round"/>
    <circle cx="-50" cy="-16" r="12" fill="#ffe884" stroke="#ba761f" stroke-width="5"/>
    <circle cx="7" cy="-40" r="12" fill="#ffe884" stroke="#ba761f" stroke-width="5"/>
    <circle cx="67" cy="-14" r="12" fill="#ffe884" stroke="#ba761f" stroke-width="5"/>
    <path d="M-7 13 L8 -6 L23 13 L8 34 Z"
          fill="url(#sp-gem)" stroke="#9c3765" stroke-width="5"/>
    <circle cx="-35" cy="55" r="8" fill="#ec4d8d" stroke="#9c3765" stroke-width="4"/>
    <circle cx="35" cy="58" r="8" fill="#ec4d8d" stroke="#9c3765" stroke-width="4"/>
  </g>

  <!-- a few intentional highlights for the more illustrated Kraken-like finish -->
  <path d="M223 245 C328 204 470 205 592 229"
        fill="none" stroke="#c4e0e8" stroke-width="11" stroke-linecap="round" opacity="0.38"/>
  <path d="M582 487 C643 506 706 542 757 585"
        fill="none" stroke="#85b3c5" stroke-width="8" stroke-linecap="round" opacity="0.45"/>
</svg>
