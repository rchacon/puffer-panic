<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="title desc">
  <title id="title">Mosasaurus</title>
  <desc id="desc">An open-jawed mosasaurus with mottled blue-grey skin, paddle flippers and a long tapering tail, drawn nose-left.</desc>

  <!-- rear flippers (farther, drawn first so the front pair overlaps them) -->
  <g fill="#20465f" stroke="#0a1c2b" stroke-width="6" stroke-linejoin="round">
    <path d="M470,232 C450,255 432,282 424,312 C420,332 420,348 426,358 C438,344 456,318 470,292 C482,270 490,250 492,235 C485,232 477,231 470,232 Z" />
    <path d="M530,225 C515,250 502,278 498,306 C496,324 498,338 504,346 C516,332 530,308 540,282 C548,262 552,244 550,230 C544,227 537,225 530,225 Z" />
  </g>
  <g fill="#5f95ae" opacity="0.55">
    <ellipse cx="450" cy="300" rx="7" ry="11" transform="rotate(20 450 300)" />
    <ellipse cx="518" cy="278" rx="6" ry="10" transform="rotate(15 518 278)" />
  </g>

  <!-- main body: neck through tail, tapering to a small tail-fin flick -->
  <path
    d="M175,150
       C220,138 245,136 260,140
       C300,148 340,142 370,150
       C405,160 435,168 460,175
       C490,182 515,178 540,175
       C565,172 590,162 610,150
       C635,136 655,128 670,115
       C688,100 703,92 715,80
       C726,70 740,62 748,55
       C756,49 764,45 770,42
       C782,36 792,22 792,15
       C792,15 785,30 778,38
       C770,47 765,49 760,48
       C740,72 722,88 715,95
       C695,112 678,128 660,145
       C635,165 618,180 600,195
       C575,207 550,215 520,222
       C495,227 460,230 430,232
       C398,231 368,230 340,228
       C310,224 282,217 255,210
       C232,201 215,193 200,185
       C193,178 183,163 175,150
       Z"
    fill="#20465f"
    stroke="#0a1c2b"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- belly: pale underside, following the body path's own bottom edge (same
       control points) so it actually follows the silhouette instead of
       reading as a floating patch, closed with a return sweep through the
       interior and faded at that inner edge rather than a hard seam -->
  <path
    d="M715,95
       C695,112 678,128 660,145
       C635,165 618,180 600,195
       C575,207 550,215 520,222
       C495,227 460,230 430,232
       C398,231 368,230 340,228
       C310,224 282,217 255,210
       C232,201 215,193 200,185
       C230,195 280,200 340,205
       C380,208 405,210 430,212
       C460,210 490,209 520,207
       C550,200 575,190 600,180
       C620,168 640,155 660,135
       C680,115 700,100 715,95
       Z"
    fill="#bcdcec"
    opacity="0.92"
  />

  <!-- back/tail mottling: an original spot pattern in the same spirit as the
       reference, not a trace of it -->
  <g fill="#3f6f92" opacity="0.85">
    <ellipse cx="245" cy="158" rx="16" ry="7" transform="rotate(-8 245 158)" />
    <ellipse cx="300" cy="150" rx="10" ry="6" transform="rotate(10 300 150)" />
    <ellipse cx="350" cy="163" rx="14" ry="6" transform="rotate(-5 350 163)" />
    <ellipse cx="405" cy="178" rx="9" ry="6" />
    <ellipse cx="455" cy="188" rx="15" ry="6" transform="rotate(8 455 188)" />
    <ellipse cx="505" cy="182" rx="10" ry="5" transform="rotate(-6 505 182)" />
    <ellipse cx="555" cy="168" rx="13" ry="6" transform="rotate(-15 555 168)" />
    <ellipse cx="600" cy="148" rx="9" ry="5" transform="rotate(-25 600 148)" />
    <ellipse cx="645" cy="122" rx="11" ry="5" transform="rotate(-30 645 122)" />
    <ellipse cx="685" cy="98" rx="9" ry="4" transform="rotate(-35 685 98)" />
    <ellipse cx="720" cy="72" rx="8" ry="3.5" transform="rotate(-40 720 72)" />
    <ellipse cx="230" cy="180" rx="7" ry="5" />
    <ellipse cx="290" cy="195" rx="6" ry="4" />
  </g>

  <!-- front flippers (nearer, on top of the body edge and the rear pair) -->
  <g fill="#28516d" stroke="#0a1c2b" stroke-width="6" stroke-linejoin="round">
    <path d="M300,232 C278,255 258,282 250,314 C246,335 246,352 253,362 C267,347 287,320 302,292 C315,268 323,247 325,232 C317,230 308,230 300,232 Z" />
    <path d="M365,230 C348,257 334,286 329,316 C327,335 329,350 336,359 C349,344 364,318 375,290 C384,268 389,248 387,233 C380,230 372,229 365,230 Z" />
  </g>
  <g fill="#6fa8c4" opacity="0.6">
    <ellipse cx="280" cy="305" rx="8" ry="12" transform="rotate(18 280 305)" />
    <ellipse cx="300" cy="278" rx="6" ry="9" transform="rotate(12 300 278)" />
    <ellipse cx="350" cy="295" rx="7" ry="11" transform="rotate(16 350 295)" />
  </g>

  <!-- head: skull + upper jaw, snout pointing left -->
  <path
    d="M195,120
       C170,112 158,110 150,110
       C120,113 100,116 90,120
       C60,127 35,133 20,140
       C18,143 17,148 18,155
       C40,158 60,163 70,168
       C95,172 115,175 130,178
       C148,181 162,183 170,185
       C180,188 190,191 195,195
       C199,180 200,165 200,150
       C199,140 197,129 195,120
       Z"
    fill="#20465f"
    stroke="#0a1c2b"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- lower jaw: hinged open, dropped down and back -->
  <path
    d="M195,200
       C165,201 178,203 150,205
       C120,209 108,211 100,215
       C80,220 65,222 55,225
       C40,229 30,232 25,235
       C24,240 25,246 30,250
       C55,254 65,255 80,255
       C105,257 120,257 140,255
       C160,253 175,250 190,245
       C196,238 199,231 200,225
       C200,216 198,207 195,200
       Z"
    fill="#bcdcec"
    stroke="#0a1c2b"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- mouth interior -->
  <path
    d="M18,155
       C40,158 60,163 70,168
       C95,172 115,175 130,178
       C148,181 162,183 170,185
       C180,188 190,191 195,195
       C195,197 195,199 195,200
       C165,201 150,205 150,205
       C120,209 108,211 100,215
       C80,220 65,222 55,225
       C40,229 30,232 25,235
       C24,225 20,190 18,155
       Z"
    fill="#7a2f38"
  />
  <path d="M60,180 C90,190 130,195 170,192 C175,196 178,199 178,199 C130,200 85,196 55,187 Z" fill="#a4454f" opacity="0.8" />

  <!-- teeth -->
  <g fill="#f5f0dc" stroke="#0a1c2b" stroke-width="1.5" stroke-linejoin="round">
    <path d="M28,150 L33,163 L38,151 Z" />
    <path d="M52,161 L58,175 L64,162 Z" />
    <path d="M80,169 L87,184 L93,170 Z" />
    <path d="M110,175 L117,190 L123,176 Z" />
    <path d="M140,180 L147,194 L153,181 Z" />
    <path d="M168,185 L174,198 L180,186 Z" />
    <path d="M33,233 L38,220 L44,232 Z" />
    <path d="M60,224 L66,210 L72,222 Z" />
    <path d="M92,214 L98,201 L104,213 Z" />
    <path d="M124,208 L130,196 L136,207 Z" />
    <path d="M154,203 L160,192 L166,202 Z" />
    <path d="M182,199 L187,189 L193,198 Z" />
  </g>

  <!-- eye -->
  <path d="M140,108 Q160,98 182,106" fill="none" stroke="#0a1c2b" stroke-width="5" stroke-linecap="round" />
  <ellipse cx="165" cy="133" rx="10" ry="11" fill="#e8c84a" stroke="#0a1c2b" stroke-width="3" />
  <ellipse cx="168" cy="136" rx="4.5" ry="5.5" fill="#1a1206" />
  <circle cx="170" cy="132" r="1.6" fill="#fff8e0" />

  <!-- nostril -->
  <ellipse cx="45" cy="128" rx="3.5" ry="2" fill="#0a1c2b" opacity="0.85" />
</svg>
